[project]
name = "degen-sim"
version = "0.1.0"
description = "Monte Carlo skill-vs-luck standings for a friend group's weekly sports picks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1.0",
    "pandas>=2.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/degen_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests `import generate_data` (scripts/ isn't a package).
pythonpath = ["scripts"]
